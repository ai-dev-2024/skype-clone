config:
  target: 'http://localhost:5000'
  phases:
    # Warm up phase
    - duration: 60
      arrivalRate: 5
      name: "Warm up"
    # Load testing phase
    - duration: 300
      arrivalRate: 20
      name: "Load testing"
    # Stress testing phase
    - duration: 120
      arrivalRate: 50
      name: "Stress testing"
  defaults:
    headers:
      Content-Type: 'application/json'

scenarios:
  - name: "User Registration"
    weight: 20
    flow:
      - post:
          url: "/api/auth/register"
          json:
            username: "testuser_{{ $randomInt }}"
            email: "test{{ $randomInt }}@example.com"
            password: "password123"
            firstName: "Test"
            lastName: "User{{ $randomInt }}"
          expect:
            - statusCode: 201
          capture:
            json: "$.data.token"
            as: "auth_token"

  - name: "User Login"
    weight: 30
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "existing@example.com"
            password: "password123"
          expect:
            - statusCode: 200
          capture:
            json: "$.data.token"
            as: "auth_token"

  - name: "Health Check"
    weight: 50
    flow:
      - get:
          url: "/health"
          expect:
            - statusCode: 200
